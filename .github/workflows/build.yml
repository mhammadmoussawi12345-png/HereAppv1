name: Build HereApp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Capacitor App
        run: |
          rm -rf android
          rm -rf node_modules
          rm -rf www
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir www
          cp index.html www/index.html
          
          npx cap init HereApp com.hereapp.messenger --web-dir=www
          npx cap add android
          
          # الإصلاح السحري: تعديل ملف الـ build.gradle ليتوافق مع النسخ
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.8.22"/' android/build.gradle || true
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HereApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk