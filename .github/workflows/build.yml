name: Build HereApp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean and Build Capacitor App
        run: |
          # 1. تنظيف شامل لأي ملفات أندرويد قديمة
          rm -rf android
          rm -rf node_modules
          rm -rf www
          
          # 2. تجهيز مشروع Node.js
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. تجهيز ملف الويب
          mkdir www
          cp index.html www/index.html
          
          # 4. بناء Capacitor وإضافة الأندرويد
          npx cap init HereApp com.hereapp.messenger --web-dir=www
          npx cap add android
          
          # 5. إصلاح تعارض Kotlin داخل مشروع الأندرويد
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } }" >> android/build.gradle
          
          # 6. بناء الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HereApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk