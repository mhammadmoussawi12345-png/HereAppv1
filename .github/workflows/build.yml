name: Build HereApp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Capacitor App
        run: |
          # تنظيف شامل
          rm -rf android
          rm -rf node_modules
          rm -rf www
          
          # تجهيز المشروع
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # تجهيز الويب
          mkdir www
          cp index.html www/index.html
          
          # بناء Capacitor
          npx cap init HereApp com.hereapp.messenger --web-dir=www
          npx cap add android
          
          # الإصلاح الجذري: حذف الكوتلن القديم وإجبار استخدام نسخة وحدة
          sed -i '/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7/d' android/build.gradle
          sed -i '/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8/d' android/build.gradle
          sed -i '/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8/d' android/app/build.gradle
          
          # ضبط الـ Gradle عشان يستخدم Kotlin 1.9.20
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20' } }" >> android/app/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HereApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk