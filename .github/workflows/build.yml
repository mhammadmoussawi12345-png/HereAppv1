name: Build HereApp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Capacitor App
        run: |
          # نمسح أي ملفات أندرويد قديمة عشان ما تتعارض
          rm -rf android
          rm -rf node_modules
          
          # نجهز المشروع
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # نعمل مجلد www وننقل ملف الـ html
          mkdir www
          mv index.html www/index.html
          
          # نعمل مشروع أندرويد ونبني الـ APK
          npx cap init HereApp com.hereapp.messenger --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HereApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk