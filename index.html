<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>HereApp</title>
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --border: rgba(212, 175, 55, 0.24);
      --gold: #d4af37; --gold-light: #f1d77a; --text: #f5f2eb; --muted: #9a9488;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: var(--text); font-family: var(--font); display: flex; justify-content: center; min-height: 100dvh; overflow: hidden; }
    .app { width: 100%; height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
    
    /* شاشات الدخول */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 21px; font-weight: 800; color: var(--gold); }
    .auth-box { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 440px; margin: 0 auto; width: 100%; }
    .logo { width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 16px; border: 1.5px solid var(--gold); color: var(--gold); font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
    .input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 13px 15px; border-radius: 14px; font-size: 15px; outline: none; }
    .input:focus { border-color: var(--gold); }
    .btn-gold { width: 100%; padding: 14px; border: none; border-radius: 14px; background: var(--gold); color: #0a0a0a; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .auth-switch { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
    .auth-switch button { background: none; border: none; color: var(--gold); font-weight: 700; cursor: pointer; }
    
    /* الشاشات */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; min-height: 100%; }

    /* شاشة البروفايل */
    .avatar-upload { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 40px; cursor: pointer; position: relative; overflow: hidden; }
    .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
    .id-badge { background: var(--surface-2); color: var(--gold); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--gold); font-weight: 800; display: inline-block; margin-bottom: 20px; font-size: 14px; letter-spacing: 2px; }

    /* شاشة المحادثات (الشريط السفلي) */
    .chat-screen { display: flex; flex-direction: column; height: 100dvh; }
    .chat-header { padding: 15px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { color: var(--gold); font-size: 20px; }
    .chat-body { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .bottom-nav { display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 0; position: fixed; bottom: 0; width: 100%; max-width: 440px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 12px; cursor: pointer; gap: 4px; }
    .nav-item.active { color: var(--gold); }
    .nav-item span { font-size: 20px; }
  </style>
</head>
<body>
  <div class="app">
    
    <!-- 1. شاشة تسجيل الدخول -->
    <section id="screen-login" class="screen active">
      <div class="topbar"><h1>HereApp</h1></div>
      <div class="auth-box">
        <div class="logo">H</div>
        <h2 style="text-align:center;margin-bottom:6px;">مرحباً بك في HereApp</h2>
        <form id="login-form">
          <div class="field"><label>البريد الإلكتروني</label><input id="login-email" class="input" type="email" required /></div>
          <div class="field"><label>كلمة المرور</label><input id="login-pass" class="input" type="password" required /></div>
          <button class="btn-gold" type="submit">تسجيل الدخول</button>
        </form>
        <div class="auth-switch">ليس لديك حساب؟ <button onclick="toggleScreen('register')">إنشاء حساب</button></div>
      </div>
    </section>

    <!-- 2. شاشة إنشاء حساب -->
    <section id="screen-register" class="screen">
      <div class="topbar"><h1>HereApp</h1></div>
      <div class="auth-box">
        <div class="logo">H</div>
        <h2 style="text-align:center;margin-bottom:20px;">إنشاء حساب جديد</h2>
        <form id="register-form">
          <div class="field"><label>البريد الإلكتروني</label><input id="reg-email" class="input" type="email" required /></div>
          <div class="field"><label>كلمة المرور</label><input id="reg-pass" class="input" type="password" required minlength="6" /></div>
          <button class="btn-gold" type="submit">إنشاء حساب</button>
        </form>
        <div class="auth-switch">لديك حساب بالفعل؟ <button onclick="toggleScreen('login')">تسجيل الدخول</button></div>
      </div>
    </section>

    <!-- 3. شاشة إعداد البروفايل -->
    <section id="screen-profile-setup" class="screen">
      <div class="topbar"><h1>إعداد الملف الشخصي</h1></div>
      <div class="auth-box">
        <div class="avatar-upload" onclick="alert('ميزة رفع الصور رح تنضاف بالمرحلة الجاية!')">
          <span>+</span>
        </div>
        <div style="text-align: center;">
          <div id="my-id-badge" class="id-badge">ID: 00001</div>
        </div>
        <form id="profile-form">
          <div class="field"><label>الاسم الكامل</label><input id="prof-name" class="input" type="text" required placeholder="مثال: محمد أحمد" /></div>
          <div class="field"><label>اسم المستخدم (@)</label><input id="prof-username" class="input" type="text" required placeholder="example_user" /></div>
          <button class="btn-gold" type="submit">حفظ والمتابعة</button>
        </form>
      </div>
    </section>

    <!-- 4. الشاشة الرئيسية (المحادثات) -->
    <section id="screen-main" class="screen">
      <div class="chat-screen">
        <div class="chat-header">
          <h2>المحادثات</h2>
          <button onclick="logout()" style="background:none; border:1px solid var(--border); color:var(--text); padding:5px 10px; border-radius:8px;">خروج</button>
        </div>
        <div class="chat-body">
          <p>لا توجد محادثات حالياً...</p>
        </div>
        
        <!-- الشريط السفلي -->
        <div class="bottom-nav">
          <div class="nav-item active"><span>💬</span>محادثات</div>
          <div class="nav-item"><span>👥</span>مجموعات</div>
          <div class="nav-item"><span>🔍</span>استكشاف</div>
          <div class="nav-item"><span>👤</span>حسابي</div>
          <div class="nav-item"><span>⚙️</span>إعدادات</div>
        </div>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGkVEsl68ls9WxqG5y3DTz8Ll2vdSR7N8",
      authDomain: "hereapp-66c04.firebaseapp.com",
      projectId: "hereapp-66c04",
      storageBucket: "hereapp-66c04.firebasestorage.app",
      messagingSenderId: "1036280676332",
      appId: "1:1036280676332:web:537af99e6309677ff90ac9",
      measurementId: "G-E1L96XGDMH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.toggleScreen = (screenId) => {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screenId).classList.add('active');
    };

    window.logout = () => signOut(auth);

    // إنشاء حساب
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;
      
      createUserWithEmailAndPassword(auth, email, pass)
        .then(() => alert("تم إنشاء الحساب! يلا نجهز بروفايلك."))
        .catch((error) => alert("خطأ: " + error.message));
    });

    // تسجيل الدخول
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      
      signInWithEmailAndPassword(auth, email, pass)
        .catch((error) => alert("خطأ: " + error.message));
    });

    // حفظ البروفايل بقاعدة البيانات
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('prof-name').value;
      const username = document.getElementById('prof-username').value;
      const user = auth.currentUser;
      if (!user) return;

      // كود لتوليد رقم ID مميز (تجريبي)
      // إحنا بنعطي أول حساب رقم 00001، وباقي الحسابات أرقام عشوائية
      let newId = "00001"; 
      if (user.email !== "mhammadmoussawi12345@gmail.com" && user.email !== "admin@hereapp.com") { // إيميلك كأدمن
         newId = Math.floor(10000 + Math.random() * 90000).toString();
      }

      try {
        await setDoc(doc(db, "users", user.uid), {
          name: name,
          username: username,
          hereAppId: newId,
          email: user.email,
          createdAt: new Date()
        });
        alert("تم حفظ البروفايل بنجاح!");
        checkUserData(user.uid); // ننقله للشاشة الرئيسية
      } catch (error) {
        alert("خطأ في الحفظ: " + error.message);
      }
    });

    // التحقق من حالة الدخول والبروفايل
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // إذا مسجل دخول، نتأكد إذا عنده بروفايل بقاعدة البيانات
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          // عنده بروفايل، نوديه للشات
          toggleScreen('main');
        } else {
          // ما عنده بروفايل، نوديه لصفحة الإعداد
          toggleScreen('profile-setup');
        }
      } else {
        toggleScreen('login');
      }
    });

  </script>
</body>
</html>
