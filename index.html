<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>HereApp</title>
  <style>
    :root { 
      --bg: #0a0a0a; --surface: #131313; --surface-2: #1b1a17; 
      --accent: #d4af37; --accent-light: #f2d984; 
      --border: rgba(212,175,55,0.22); --border-sub: rgba(255,255,255,0.08); 
      --text: #f6f4ef; --muted: #9c9689; --nav-h: 64px; 
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      --serif: Georgia, serif; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; background: #000; color: var(--text); font-family: var(--font); overflow: hidden; }
    .app { width: 100%; max-width: 460px; height: 100dvh; margin: 0 auto; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .screen { display: none; flex: 1; flex-direction: column; height: 100%; overflow-y: auto; animation: fadeIn 0.25s; }
    .screen.active { display: flex; }
    .screen.has-nav { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Icons & Topbar */
    svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 18px 14px; background: var(--surface); border-bottom: 1px solid var(--border-sub); position: sticky; top: 0; z-index: 20; }
    .top h1 { font-family: var(--serif); font-size: 24px; color: var(--accent); }
    
    /* Buttons & Inputs */
    .btn { width: 100%; min-height: 50px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-gold { background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: #000; border: none; }
    .btn-out { background: transparent; border: 1px solid var(--border); color: var(--accent); }
    .auth { flex: 1; display: flex; flex-direction: column; padding: 24px; justify-content: center; }
    .auth h2 { font-family: var(--serif); font-size: 28px; margin-bottom: 8px; }
    .auth p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .field { position: relative; margin-bottom: 16px; }
    .field input { width: 100%; height: 56px; padding: 20px 16px 6px; background: var(--surface); border: 1px solid var(--border-sub); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .field label { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; transition: 0.2s; }
    .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label { top: 12px; font-size: 11px; color: var(--accent); font-weight: 700; }
    
    /* Lists & Chat */
    .search-wrap { padding: 12px 16px; display: flex; gap: 8px; }
    .search-wrap input { flex: 1; background: var(--surface); border: 1px solid var(--border-sub); border-radius: 999px; padding: 0 16px; color: var(--text); outline: none; height: 44px; }
    .search-wrap button { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; color: #000; font-weight: 700; cursor: pointer; }
    .list { display: flex; flex-direction: column; padding: 8px 12px; gap: 4px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; cursor: pointer; }
    .row:active { background: var(--surface); }
    .av { width: 50px; height: 50px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .info { flex: 1; }
    .info .name { font-weight: 700; font-size: 15px; }
    .info .sub { font-size: 13px; color: var(--muted); }
    
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .bubble.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--border-sub); border-bottom-left-radius: 4px; }
    .bubble.out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
    .composer { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border-sub); }
    .composer input { flex: 1; height: 44px; background: var(--bg); border: 1px solid var(--border-sub); border-radius: 999px; padding: 0 16px; color: var(--text); outline: none; }
    .composer button { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; font-size: 18px; cursor: pointer; }
    
    /* Bottom Nav */
    .nav { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border-sub); display: none; grid-template-columns: repeat(5, 1fr); z-index: 30; }
    .nav.vis { display: grid; }
    .nav button { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; cursor: pointer; }
    .nav button.on { color: var(--accent); }
    
    /* Welcome */
    .welcome { background: radial-gradient(circle at top right, rgba(212,175,55,0.15), transparent 50%), var(--bg); padding: 24px; justify-content: space-between; }
    .welcome .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .logo { width: 90px; height: 90px; border-radius: 26px; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .welcome h1 { font-family: var(--serif); font-size: 36px; color: var(--accent); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app">
    
    <!-- 1. WELCOME -->
    <section id="s-welcome" class="screen active welcome">
      <div class="center">
        <div class="logo"><svg width="46" height="46" viewBox="0 0 48 48" fill="none"><path d="M12 10V38M36 10V38M12 24H36" stroke="#D4AF37" stroke-width="3.6" stroke-linecap="round"/></svg></div>
        <h1>HereApp</h1>
        <p style="color:var(--muted); font-size:14px; margin-top:8px;">JUST BE HERE.</p>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="btn btn-gold" onclick="go('signin')">Sign In</button>
        <button class="btn btn-out" onclick="go('signup')">Create Account</button>
      </div>
    </section>

    <!-- 2. SIGN IN -->
    <section id="s-signin" class="screen">
      <div class="top"><button class="btn-out" style="width:40px;height:40px;padding:0;border-radius:50%;" onclick="go('welcome')">←</button><h1>Sign In</h1><div></div></div>
      <div class="auth">
        <h2>Welcome Back</h2><p>Enter your credentials to resume.</p>
        <form id="form-signin">
          <div class="field"><input type="email" id="si-email" placeholder=" " required><label>Email Address</label></div>
          <div class="field"><input type="password" id="si-pass" placeholder=" " required><label>Password</label></div>
          <button class="btn btn-gold" type="submit" style="margin-top:12px;">Sign In</button>
        </form>
      </div>
    </section>

    <!-- 3. SIGN UP -->
    <section id="s-signup" class="screen">
      <div class="top"><button class="btn-out" style="width:40px;height:40px;padding:0;border-radius:50%;" onclick="go('welcome')">←</button><h1>Create Account</h1><div></div></div>
      <div class="auth">
        <h2>Claim Identity</h2><p>Reserve your @username.</p>
        <form id="form-signup">
          <div class="field"><input type="text" id="su-name" placeholder=" " required><label>Full Name</label></div>
          <div class="field"><input type="text" id="su-user" placeholder=" " required><label>@Username</label></div>
          <div class="field"><input type="email" id="su-email" placeholder=" " required><label>Email Address</label></div>
          <div class="field"><input type="password" id="su-pass" placeholder=" " required><label>Password</label></div>
          <button class="btn btn-gold" type="submit" style="margin-top:12px;">Create Account</button>
        </form>
      </div>
    </section>

    <!-- 4. CHATS -->
    <section id="s-chats" class="screen has-nav">
      <div class="top"><h1>Chats</h1></div>
      <div class="search-wrap">
        <input id="search-id" type="text" placeholder="Search HereApp ID...">
        <button onclick="searchUser()">🔍</button>
      </div>
      <div id="results" class="list"></div>
      <div id="chat-list" class="list"></div>
    </section>

    <!-- 5. CHAT ROOM -->
    <section id="s-chat" class="screen">
      <div class="top"><button class="btn-out" style="width:40px;height:40px;padding:0;border-radius:50%;" onclick="go('chats')">←</button><h1 id="c-name">Chat</h1><div></div></div>
      <div id="msgs" class="msgs"></div>
      <form id="form-msg" class="composer">
        <input id="msg-inp" type="text" placeholder="Type a message..." required>
        <button type="submit">➤</button>
      </form>
    </section>

    <!-- 6. PROFILE -->
    <section id="s-profile" class="screen has-nav">
      <div class="top"><h1>Profile</h1></div>
      <div style="text-align:center; padding:30px 20px;">
        <div class="av" id="p-av" style="width:90px;height:90px;font-size:32px;margin:0 auto 16px;"></div>
        <h2 id="p-name" style="font-size:24px;">User</h2>
        <p id="p-id" style="color:var(--accent); font-size:14px; margin-top:4px;"></p>
        <button class="btn btn-out" style="margin-top:30px; color:#ff6b6b; border-color:#ff6b6b;" onclick="logout()">Sign Out</button>
      </div>
    </section>

    <!-- 7. OTHERS -->
    <section id="s-groups" class="screen has-nav"><div class="top"><h1>Groups</h1></div></section>
    <section id="s-discover" class="screen has-nav"><div class="top"><h1>Discover</h1></div></section>
    <section id="s-settings" class="screen has-nav"><div class="top"><h1>Settings</h1></div><div style="padding:20px;"><button class="btn btn-out" onclick="logout()">Sign Out</button></div></section>

    <!-- NAV -->
    <nav id="nav" class="nav">
      <button onclick="go('chats')" data-t="chats"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chats</button>
      <button onclick="go('groups')" data-t="groups"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Groups</button>
      <button onclick="go('discover')" data-t="discover"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>Discover</button>
      <button onclick="go('profile')" data-t="profile"><svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>
      <button onclick="go('settings')" data-t="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const fc = { apiKey: "AIzaSyCGkVEsl68ls9WxqG5y3DTz8Ll2vdSR7N8", authDomain: "hereapp-66c04.firebaseapp.com", projectId: "hereapp-66c04", storageBucket: "hereapp-66c04.firebasestorage.app", messagingSenderId: "1036280676332", appId: "1:1036280676332:web:537af99e6309677ff90ac9" };
    const app = initializeApp(fc); const auth = getAuth(app); const db = getFirestore(app);
    const OWNER = "mhammadmoussawi12345@gmail.com";
    let uid = null, chatId = null;

    window.go = (s) => {
      document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
      document.getElementById('s-' + s).classList.add('active');
      const nav = ['chats','groups','discover','profile','settings'].includes(s);
      document.getElementById('nav').classList.toggle('vis', nav);
      document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === s));
    };

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        uid = u.uid;
        const d = await getDoc(doc(db, "users", u.uid));
        if (d.exists()) {
          document.getElementById('p-name').innerText = d.data().displayName;
          document.getElementById('p-id').innerText = "@" + d.data().username + " • ID: " + d.data().hereAppId;
          document.getElementById('p-av').innerText = d.data().displayName.charAt(0);
        }
        go('chats');
      } else { go('welcome'); }
    });

    document.getElementById('form-signin').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await signInWithEmailAndPassword(auth, document.getElementById('si-email').value, document.getElementById('si-pass').value); }
      catch(err) { alert(err.message); }
    });

    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('su-email').value;
      try {
        const c = await createUserWithEmailAndPassword(auth, email, document.getElementById('su-pass').value);
        const id = email === OWNER ? "00001" : Math.floor(10000 + Math.random() * 90000).toString();
        await setDoc(doc(db, "users", c.user.uid), { displayName: document.getElementById('su-name').value, username: document.getElementById('su-user').value.replace('@',''), hereAppId: id, email: email });
      } catch(err) { alert(err.message); }
    });

    window.searchUser = async () => {
      const t = document.getElementById('search-id').value.trim();
      if(!t) return;
      const r = document.getElementById('results'); r.innerHTML = "Searching...";
      const q = query(collection(db, "users"), where("hereAppId", "==", t));
      const s = await getDocs(q); r.innerHTML = "";
      if(s.empty) { r.innerHTML = "<p style='color:red'>Not found.</p>"; return; }
      s.forEach(d => {
        const data = d.data();
        r.innerHTML = `<div class="row" onclick="openChat('${d.id}', '${data.displayName}')"><div class="av">${data.displayName.charAt(0)}</div><div class="info"><div class="name">${data.displayName}</div><div class="sub">ID: ${data.hereAppId}</div></div></div>`;
      });
    };

    window.openChat = (oid, name) => {
      chatId = [uid, oid].sort().join("_");
      document.getElementById('c-name').innerText = name;
      go('chat');
      onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc")), (snap) => {
        const box = document.getElementById('msgs'); box.innerHTML = "";
        snap.forEach(d => {
          const m = d.data();
          box.innerHTML += `<div class="bubble ${m.senderId === uid ? 'out' : 'in'}">${m.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
      });
    };

    document.getElementById('form-msg').addEventListener('submit', async (e) => {
      e.preventDefault();
      const i = document.getElementById('msg-inp');
      if(!i.value.trim() || !chatId) return;
      await addDoc(collection(db, "chats", chatId, "messages"), { text: i.value, senderId: uid, createdAt: serverTimestamp() });
      i.value = "";
    });

    window.logout = () => signOut(auth);
  </script>
</body>
</html>
