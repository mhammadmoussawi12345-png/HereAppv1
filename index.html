<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>HereApp</title>
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1b18;
      --accent: #d4af37; --accent-light: #f3dc86; --accent-dim: rgba(212, 175, 55, 0.14);
      --border: rgba(212, 175, 55, 0.25); --text: #f5f2eb; --muted: #9a9488;
      --on-accent: #0a0a0a; --nav-h: 68px; --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: var(--text); font-family: var(--font); display: flex; justify-content: center; min-height: 100dvh; }
    .app-shell { width: 100%; max-width: 440px; min-height: 100dvh; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow-x: hidden; }
    .screen { display: none; flex: 1; flex-direction: column; min-height: 100dvh; animation: fadeSlide 0.24s ease; }
    .screen.active { display: flex; }
    .screen.with-nav { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 18px 14px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .topbar-title { font-size: 22px; font-weight: 800; color: var(--accent); }
    .pill-btn { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--accent); font-size: 17px; cursor: pointer; }
    
    /* Welcome */
    .welcome-screen { background: radial-gradient(circle at top center, var(--accent-dim), transparent 52%), var(--bg); padding: calc(18px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom)); }
    .welcome-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 0; }
    .emblem { width: 92px; height: 92px; border-radius: 26px; border: 1.5px solid var(--accent); background: linear-gradient(145deg, var(--surface-2), var(--bg)); color: var(--accent); font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    .welcome-title { font-size: 34px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
    .welcome-sub { font-size: 14px; color: var(--muted); max-width: 300px; }
    .welcome-actions { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
    
    /* Auth */
    .auth-wrap { flex: 1; display: flex; flex-direction: column; padding: 20px 24px 28px; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 14px; font-size: 15px; outline: none; }
    .input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: var(--on-accent); font-size: 15px; font-weight: 800; cursor: pointer; }
    
    /* Chats */
    .search-box { padding: 12px 16px 6px; }
    .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 11px 16px; color: var(--text); font-size: 14px; outline: none; }
    .section { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .chat-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 16px; cursor: pointer; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
    .chat-meta { flex: 1; }
    .chat-name { font-weight: 700; font-size: 15px; }
    
    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); display: none; grid-template-columns: repeat(5, 1fr); z-index: 30; }
    .bottom-nav.visible { display: grid; }
    .nav-item { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-item .nav-icon { font-size: 19px; }

    /* Chat Room */
    .messages-area { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .msg { max-width: 78%; padding: 11px 14px; border-radius: 18px; font-size: 14px; }
    .msg.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
    .msg.out { align-self: flex-end; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: var(--on-accent); }
    .composer { display: flex; align-items: center; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
    .composer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 11px 16px; color: var(--text); font-size: 14px; outline: none; }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: var(--on-accent); font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. WELCOME -->
    <section id="screen-welcome" class="screen welcome-screen active">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="color:var(--accent);font-weight:800;font-size:12px;">✦ HEREAPP</span>
      </div>
      <div class="welcome-hero">
        <div class="emblem">H</div>
        <h1 class="welcome-title">HereApp</h1>
        <p class="welcome-sub">Private global messaging crafted with luxury Black & Gold precision.</p>
      </div>
      <div class="welcome-actions">
        <button class="btn-primary" onclick="navigate('signin')">Sign In</button>
      </div>
    </section>

    <!-- 2. SIGN IN -->
    <section id="screen-signin" class="screen">
      <div class="topbar">
        <button class="icon-btn" onclick="navigate('welcome')">←</button>
        <span class="topbar-title">Sign In</span>
        <div></div>
      </div>
      <div class="auth-wrap">
        <form id="signin-form">
          <div class="field"><label>Email</label><input id="signin-email" class="input" type="email" required placeholder="name@hereapp.com" /></div>
          <div class="field"><label>Password</label><input id="signin-password" class="input" type="password" required placeholder="••••••••" /></div>
          <button class="btn-primary" type="submit">Sign In</button>
        </form>
      </div>
    </section>

    <!-- 3. CHATS (Main) -->
    <section id="screen-chats" class="screen with-nav">
      <div class="topbar">
        <span class="topbar-title">Chats</span>
      </div>
      <div class="search-box">
        <input id="search-user" class="search-input" type="text" placeholder="Search by HereApp ID..." />
        <button class="btn-primary" style="margin-top:10px; padding:8px; font-size:12px;" onclick="searchUser()">Search ID</button>
      </div>
      <div id="search-results" class="section"></div>
      <div id="chat-list" class="section"></div>
    </section>

    <!-- 4. CHAT DETAIL -->
    <section id="screen-chat-detail" class="screen">
      <div class="topbar">
        <button class="icon-btn" onclick="navigate('chats')">←</button>
        <span id="active-chat-name" class="topbar-title">Chat</span>
        <div></div>
      </div>
      <div id="messages-area" class="messages-area"></div>
      <form class="composer" onsubmit="sendMessage(event)">
        <input id="message-input" type="text" placeholder="Message..." required />
        <button class="send-btn" type="submit">➤</button>
      </form>
    </section>

    <!-- 5. EMPTY SCREENS (Groups, Discover, Profile, Settings) -->
    <section id="screen-groups" class="screen with-nav"><div class="topbar"><span class="topbar-title">Groups</span></div></section>
    <section id="screen-discover" class="screen with-nav"><div class="topbar"><span class="topbar-title">Discover</span></div></section>
    <section id="screen-profile" class="screen with-nav"><div class="topbar"><span class="topbar-title">Profile</span></div></section>
    <section id="screen-settings" class="screen with-nav"><div class="topbar"><span class="topbar-title">Settings</span></div><button class="btn-primary" style="margin:20px; width:calc(100% - 40px);" onclick="logout()">Sign Out</button></section>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-tab="chats" onclick="navigate('chats')"><span class="nav-icon">💬</span>Chats</button>
      <button class="nav-item" data-tab="groups" onclick="navigate('groups')"><span class="nav-icon">👥</span>Groups</button>
      <button class="nav-item" data-tab="discover" onclick="navigate('discover')"><span class="nav-icon">✦</span>Discover</button>
      <button class="nav-item" data-tab="profile" onclick="navigate('profile')"><span class="nav-icon">👤</span>Profile</button>
      <button class="nav-item" data-tab="settings" onclick="navigate('settings')"><span class="nav-icon">⚙️</span>Settings</button>
    </nav>
  </div>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGkVEsl68ls9WxqG5y3DTz8Ll2vdSR7N8",
      authDomain: "hereapp-66c04.firebaseapp.com",
      projectId: "hereapp-66c04",
      storageBucket: "hereapp-66c04.firebasestorage.app",
      messagingSenderId: "1036280676332",
      appId: "1:1036280676332:web:537af99e6309677ff90ac9",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let currentChatId = null;

    window.navigate = function(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const target = document.getElementById("screen-" + screenId);
      if (target) target.classList.add("active");
      const tabs = ["chats", "groups", "discover", "profile", "settings"];
      document.getElementById("bottom-nav").classList.toggle("visible", tabs.includes(screenId));
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === screenId);
      });
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        navigate("chats");
      } else {
        navigate("welcome");
      }
    });

    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("signin-email").value;
      const password = document.getElementById("signin-password").value;
      try { await signInWithEmailAndPassword(auth, email, password); } 
      catch (err) { alert(err.message); }
    });

    window.logout = () => signOut(auth);

    window.searchUser = async () => {
      const term = document.getElementById('search-user').value.trim();
      if(!term) return;
      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = "Searching...";

      const q = query(collection(db, "users"), where("hereAppId", "==", term));
      const snap = await getDocs(q);
      
      resultsDiv.innerHTML = "";
      if(snap.empty) {
        resultsDiv.innerHTML = "<p style='color:red;'>No user found.</p>";
        return;
      }
      
      snap.forEach((docSnap) => {
        const data = docSnap.data();
        const div = document.createElement('div');
        div.className = "chat-row";
        div.innerHTML = `
          <div class="avatar">${data.displayName ? data.displayName.slice(0,2) : 'U'}</div>
          <div class="chat-meta">
            <div class="chat-name">${data.displayName || 'User'}</div>
            <div style="color:var(--accent); font-size:12px;">ID: ${data.hereAppId}</div>
          </div>
          <button class="pill-btn" onclick="openChat('${docSnap.id}', '${data.displayName || 'User'}')">Chat</button>
        `;
        resultsDiv.appendChild(div);
      });
    };

    window.openChat = (otherId, otherName) => {
      const ids = [currentUserId, otherId].sort();
      currentChatId = ids.join("_");
      
      document.getElementById('active-chat-name').innerText = otherName;
      navigate('chat-detail');
      
      const q = query(collection(db, "chats", currentChatId, "messages"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-area');
        box.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const isMe = msg.senderId === currentUserId;
          const el = document.createElement('div');
          el.className = `msg ${isMe ? 'out' : 'in'}`;
          el.innerText = msg.text;
          box.appendChild(el);
        });
        box.scrollTop = box.scrollHeight;
      });
    };

    window.sendMessage = async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if(!text || !currentChatId) return;
      
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        text: text,
        senderId: currentUserId,
        createdAt: serverTimestamp()
      });
      input.value = "";
    };
  </script>
</body>
</html>
